<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Alzheimer's Care Partner – Pause</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #b8cfc9;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 100vh;
      padding: 32px 24px;
      font-family: 'Poppins', sans-serif;
    }

    .demo-label {
      font-size: 12px; font-weight: 600; color: rgba(17,48,42,0.6);
      letter-spacing: 0.6px; text-transform: uppercase;
    }

    /* ─── iPhone device shell ─── */
    .phone-device {
      position: relative;
      background: #1c1c1c;
      border-radius: 56px;
      padding: 12px;
      box-shadow:
        0 50px 100px rgba(0,0,0,0.45),
        0 10px 30px rgba(0,0,0,0.28),
        inset 0 1px 0 rgba(255,255,255,0.18),
        inset 0 -1px 0 rgba(0,0,0,0.4);
    }
    .phone {
      width: 375px;
      height: 812px;
      background: #dfebe8;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .phone-notch {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 124px; height: 30px;
      background: #1c1c1c;
      border-radius: 0 0 20px 20px;
      z-index: 30;
      display: flex; align-items: flex-end; justify-content: center;
      gap: 8px; padding-bottom: 7px;
    }
    .phone-notch-speaker { width: 56px; height: 6px; background: #2e2e2e; border-radius: 3px; }
    .phone-notch-cam {
      width: 10px; height: 10px; background: #1a1a2e; border-radius: 50%;
      border: 1.5px solid #2e2e2e; box-shadow: inset 0 0 3px rgba(0,0,0,0.8); flex-shrink: 0;
    }

    /* ─── Status bar ─── */
    .status-bar {
      height: 44px;
      padding: 0 18px 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .status-time { font-weight: 600; font-size: 15px; color: #11302a; letter-spacing: -0.165px; }
    .status-icons { display: flex; align-items: center; gap: 7px; }

    /* ─── Home indicator ─── */
    .home-indicator-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 21px;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: 8px;
      z-index: 20;
      pointer-events: none;
    }
    .home-indicator { width: 139px; height: 5px; background: #11302a; border-radius: 100px; }

    /* ─── Blinking face icon (Figma Motion export) ─── */
    .face-icon {
      width: 300px;
      max-width: 100%;
      aspect-ratio: 320 / 157;
    }
    .face-icon svg { display: block; width: 100%; height: 100%; }
    .blink-eye {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: eyeBlink 2s infinite;
    }

    @keyframes eyeBlink {
      0%   { transform: scaleY(1); animation-timing-function: cubic-bezier(.5,0,.5,1); }
      9%   { transform: scaleY(0); animation-timing-function: cubic-bezier(.5,0,.5,1); }
      18%  { transform: scaleY(1); }
      100% { transform: scaleY(1); }
    }

    /* ─── "Calculating result" loading text (Figma Motion export) ─── */
    .calc-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 0 24px;
    }
    .calc-text {
      width: 280px;
      max-width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      justify-content: center;
      gap: 4px;
      font-family: 'LT Soul', 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 25px;
      line-height: 32px;
      letter-spacing: -0.5px;
      color: #1c4a43;
      text-align: center;
    }
    .calc-word { display: inline-block; white-space: nowrap; }

    .w1 { animation: w1Blur 2s 1 forwards, w1Reveal 2s 1 forwards; }
    .w2 { animation: w2Blur 2s 1 forwards, w2Reveal 2s 1 forwards; }
    .w3 { animation: w3Blur 2s 1 forwards, w3Reveal 2s 1 forwards; }
    .w4 { animation: w4Blur 2s 1 forwards, w4Reveal 2s 1 forwards; }
    .w5 { animation: w5Blur 2s 1 forwards, w5Reveal 2s 1 forwards; }
    .w6 { animation: w6Blur 2s 1 forwards, w6Reveal 2s 1 forwards; }

    @keyframes w1Blur {
      0%    { filter: blur(8px); }
      10%   { filter: blur(8px); animation-timing-function: cubic-bezier(.5,0,.5,1); }
      40.2% { filter: blur(0px); }
      100%  { filter: blur(0px); }
    }
    @keyframes w1Reveal {
      0%    { opacity: 0; transform: translateY(25px); }
      10%   { opacity: 0; transform: translateY(25px); animation-timing-function: cubic-bezier(0,0,.58,1); }
      40.2% { opacity: 1; transform: translateY(0); }
      100%  { opacity: 1; transform: translateY(0); }
    }

    @keyframes w2Blur {
      0%    { filter: blur(8px); }
      17.5% { filter: blur(8px); animation-timing-function: cubic-bezier(.5,0,.5,1); }
      47.5% { filter: blur(0px); }
      100%  { filter: blur(0px); }
    }
    @keyframes w2Reveal {
      0%    { opacity: 0; transform: translateY(25px); }
      17.5% { opacity: 0; transform: translateY(25px); animation-timing-function: cubic-bezier(0,0,.58,1); }
      47.5% { opacity: 1; transform: translateY(0); }
      100%  { opacity: 1; transform: translateY(0); }
    }

    @keyframes w3Blur {
      0%   { filter: blur(8px); }
      25%  { filter: blur(8px); animation-timing-function: cubic-bezier(.5,0,.5,1); }
      55%  { filter: blur(0px); }
      100% { filter: blur(0px); }
    }
    @keyframes w3Reveal {
      0%   { opacity: 0; transform: translateY(25px); }
      25%  { opacity: 0; transform: translateY(25px); animation-timing-function: cubic-bezier(0,0,.58,1); }
      55%  { opacity: 1; transform: translateY(0); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* word 4 ("calculating") holds sharp from the previous loop, blips blurred
       just before its own reveal, per the source keyframe data */
    @keyframes w4Blur {
      0%    { filter: blur(0px); }
      32.5% { filter: blur(0px); animation-timing-function: cubic-bezier(.5,0,.5,1); }
      33%   { filter: blur(8px); animation-timing-function: cubic-bezier(.5,0,.5,1); }
      62.5% { filter: blur(0px); }
      100%  { filter: blur(0px); }
    }
    @keyframes w4Reveal {
      0%    { opacity: 0; transform: translateY(25px); }
      32.5% { opacity: 0; transform: translateY(25px); animation-timing-function: cubic-bezier(0,0,.58,1); }
      55%   { opacity: 1; transform: translateY(0); }
      100%  { opacity: 1; transform: translateY(0); }
    }

    @keyframes w5Blur {
      0%   { filter: blur(8px); }
      40%  { filter: blur(8px); animation-timing-function: cubic-bezier(.5,0,.5,1); }
      70%  { filter: blur(0px); }
      100% { filter: blur(0px); }
    }
    @keyframes w5Reveal {
      0%   { opacity: 0; transform: translateY(25px); }
      40%  { opacity: 0; transform: translateY(25px); animation-timing-function: cubic-bezier(0,0,.58,1); }
      70%  { opacity: 1; transform: translateY(0); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes w6Blur {
      0%    { filter: blur(8px); }
      47.5% { filter: blur(8px); animation-timing-function: cubic-bezier(.5,0,.5,1); }
      77.5% { filter: blur(0px); }
      100%  { filter: blur(0px); }
    }
    @keyframes w6Reveal {
      0%    { opacity: 0; transform: translateY(25px); }
      47.5% { opacity: 0; transform: translateY(25px); animation-timing-function: cubic-bezier(0,0,.58,1); }
      77.5% { opacity: 1; transform: translateY(0); }
      100%  { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
